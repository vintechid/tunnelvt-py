name: release

# Push a tag: git tag v0.1.0 && git push origin v0.1.0
# Builds and publishes to PyPI. Set PYPI_TOKEN in repo secrets.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: |
          pip install build
          python -m build

      - name: publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*
